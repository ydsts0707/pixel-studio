<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>픽셀 애니메이션 스튜디오 Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Jua & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Jua', 'Inter', sans-serif;
            background-color: #f0fdf4;
            /* 태블릿: 두 번 탭 확대 방지, 탭 하이라이트 제거 */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        button, label, select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- 한 화면 배치 (스크롤 없음) --- */
        #app {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px;
            max-width: 1100px;
            margin: 0 auto;
        }
        #workspace {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #canvas-area {
            position: relative;
            flex: 1;
            min-height: 180px;
            overflow: hidden;
        }
        /* 그림판 크기는 JS(fitCanvas)가 남은 공간에 맞춰 정해요 */
        #pixel-canvas {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none; /* 길게 누르면 뜨는 메뉴 방지 */
        }
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 6px;
        }
        .tool-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 6px;
        }
        /* 태블릿 가로: 왼쪽 그림판, 오른쪽 도구 */
        @media (orientation: landscape) and (min-width: 700px) {
            #workspace {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(300px, 380px);
                grid-template-rows: auto auto 1fr auto;
            }
            #canvas-area { grid-column: 1; grid-row: 1 / -1; }
            #trace-bar { grid-column: 2; grid-row: 1; }
            #scene-bar { grid-column: 2; grid-row: 2; }
            #palette-box { grid-column: 2; grid-row: 3; align-self: start; }
            #tool-bar { grid-column: 2; grid-row: 4; }
            .palette-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
            .tool-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-height: 60px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 13px;
            line-height: 1.1;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
            transition: transform 0.05s ease, background-color 0.15s ease;
        }
        .tool-btn:active { transform: scale(0.95); }
        .tool-btn .icon { font-size: 24px; line-height: 1; }
        .tool-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* 휴대폰처럼 작은 화면: 조금씩 줄여서 그림판 공간 확보 */
        @media (max-width: 640px) {
            #app { padding: 6px; gap: 6px; }
            #workspace { gap: 6px; }
            #canvas-area { min-height: 130px; }
            .tool-btn { min-height: 48px; font-size: 11px; border-radius: 12px; }
            .tool-btn .icon { font-size: 18px; }
            .palette-grid { gap: 4px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
            .palette-grid button { height: 32px !important; }
            #frame-tabs canvas { width: 24px; height: 24px; }
            #frame-tabs { gap: 6px; }
        }

        .pixel-cell {
            position: relative;
            border-radius: 2px;
            cursor: pointer;
            transition: background-color 0.08s ease;
        }
        /* 따라그리기: 칠해야 할 색을 가운데 점으로 표시 */
        .pixel-cell.guide::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 30%;
            height: 30%;
            transform: translate(-50%, -50%);
            border-radius: 9999px;
            background: var(--g);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.8);
        }
        .pixelated {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            object-fit: contain;
        }
        /* 지우개 선택 표시 (체크무늬) */
        .eraser-dot {
            background-image: linear-gradient(45deg, #cbd5e1 25%, transparent 25%, transparent 75%, #cbd5e1 75%),
                              linear-gradient(45deg, #cbd5e1 25%, #fff 25%, #fff 75%, #cbd5e1 75%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
        }
        /* 저장 안내 창의 그림은 길게 눌러 저장할 수 있어야 함 */
        #save-popup-img {
            -webkit-touch-callout: default;
            user-select: auto;
            -webkit-user-select: auto;
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="text-slate-800">

    <div id="app">
        <!-- Header: title, mode tabs, screen size -->
        <header class="flex items-center gap-2">
            <h1 class="text-lg sm:text-xl font-extrabold text-emerald-600 whitespace-nowrap">
                🎨<span class="hidden sm:inline"> 픽셀 스튜디오</span>
            </h1>
            <div class="flex-1 flex bg-emerald-50 p-1 rounded-2xl gap-1 border border-emerald-100">
                <button id="tab-free" onclick="switchMode('free')" class="flex-1 py-2.5 rounded-xl text-sm sm:text-base font-bold transition">
                    ✏️ 자유그리기
                </button>
                <button id="tab-trace" onclick="switchMode('trace')" class="flex-1 py-2.5 rounded-xl text-sm sm:text-base font-bold transition">
                    🖌️ 따라그리기
                </button>
            </div>
            <button onclick="openSizePicker()" title="화면 크기 바꾸기" class="bg-white border border-emerald-200 hover:bg-emerald-50 text-emerald-800 text-xs sm:text-sm font-bold py-3 px-3 rounded-xl whitespace-nowrap">
                🔲 <span id="current-grid-badge">16×16</span>
            </button>
        </header>

        <div id="workspace">
            <!-- Trace bar (따라그리기 only) -->
            <section id="trace-bar" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-2 flex flex-wrap items-center gap-2">
                <label for="image-upload-input" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-xl text-sm shadow-sm cursor-pointer transition whitespace-nowrap">
                    📁 도안 올리기
                </label>
                <input type="file" id="image-upload-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                <span id="trace-empty" class="flex-1 min-w-[140px] text-xs text-amber-800">
                    격자가 그려진 도안이나 움직이는 사진을 올려 보세요
                </span>
                <div id="trace-progress" class="hidden flex-1 min-w-[150px] flex-col gap-1">
                    <span id="trace-progress-text" class="text-xs font-bold text-amber-900">따라그리기: 0 / 0칸</span>
                    <div class="h-3 bg-amber-100 rounded-full overflow-hidden">
                        <div id="trace-progress-bar" class="h-full bg-amber-500 rounded-full transition-all duration-200" style="width: 0%"></div>
                    </div>
                </div>
                <button id="fill-guide-btn" onclick="fillFromGuide()" class="hidden bg-white border border-amber-300 hover:bg-amber-100 text-amber-800 font-bold py-3 px-3 rounded-xl text-xs whitespace-nowrap">
                    🪄 도안 색 채우기
                </button>
            </section>

            <!-- Scenes -->
            <section id="scene-bar" class="bg-slate-50 border border-slate-200 rounded-2xl p-2 flex items-center gap-2">
                <div id="frame-tabs" class="flex-1 min-w-0 flex flex-wrap items-center gap-2 pt-1">
                    <!-- Scene chips injected via JS -->
                </div>
                <button onclick="addNewFrame()" title="지금 장면을 복사해서 다음 장면을 만들어요" class="tool-btn bg-sky-500 hover:bg-sky-600 text-white px-3 shrink-0">
                    <span class="icon">➕</span>장면
                </button>
                <div class="flex flex-col items-center gap-1 shrink-0" title="움직임 미리보기">
                    <canvas id="preview-canvas" width="16" height="16" class="pixelated w-12 h-12 rounded-lg border-2 border-sky-400 bg-white"></canvas>
                    <select id="speed-select" onchange="changeSpeed(this.value)" class="text-[11px] bg-white border border-slate-200 rounded-md px-0.5 py-0.5 font-sans">
                        <option value="500">느리게</option>
                        <option value="300" selected>보통</option>
                        <option value="150">빠르게</option>
                    </select>
                </div>
            </section>

            <!-- Drawing area -->
            <section id="canvas-area" class="bg-slate-100 rounded-3xl border border-slate-200 shadow-inner">
                <div id="pixel-canvas" class="shadow-md rounded-xl overflow-hidden border border-slate-300 grid gap-[1px] bg-slate-300">
                    <!-- Pixel cells injected via JS -->
                </div>
            </section>

            <!-- Palette -->
            <section id="palette-box" class="bg-slate-50 border border-slate-200 rounded-2xl p-2 flex flex-col gap-2">
                <div class="flex items-center gap-2 px-1">
                    <span id="current-color-dot" class="w-9 h-9 rounded-full border-2 border-slate-800 shadow-sm shrink-0"></span>
                    <span id="selected-color-label" class="text-sm font-extrabold text-slate-700">지금 색: 빨강</span>
                </div>
                <div id="design-palette-wrap" class="hidden flex-col gap-1">
                    <span class="text-xs font-bold text-amber-800 px-1">도안 색</span>
                    <div id="design-palette" class="palette-grid"></div>
                </div>
                <div id="color-palette" class="palette-grid"></div>
            </section>

            <!-- Tools & Save -->
            <section id="tool-bar" class="tool-grid">
                <button onclick="setEraser()" id="eraser-btn" class="tool-btn">
                    <span class="icon">🧽</span>지우개
                </button>
                <button onclick="undo()" id="undo-btn" title="되돌리기 (Ctrl+Z)" class="tool-btn bg-slate-200 hover:bg-slate-300 text-slate-700">
                    <span class="icon">↩️</span>되돌리기
                </button>
                <button onclick="redo()" id="redo-btn" title="다시하기 (Ctrl+Y)" class="tool-btn bg-slate-200 hover:bg-slate-300 text-slate-700">
                    <span class="icon">↪️</span>다시하기
                </button>
                <button onclick="clearCanvas()" title="지금 장면과 도안을 모두 지워요" class="tool-btn bg-rose-100 hover:bg-rose-200 text-rose-700">
                    <span class="icon">🗑️</span>비우기
                </button>
                <button onclick="savePNG()" class="tool-btn bg-emerald-500 hover:bg-emerald-600 text-white">
                    <span class="icon">📷</span>사진 저장
                </button>
                <button onclick="saveGIF()" class="tool-btn bg-purple-600 hover:bg-purple-700 text-white">
                    <span class="icon">🎬</span>움직이는 사진
                </button>
            </section>
        </div>
    </div>

    <!-- Screen size picker -->
    <div id="size-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4" onclick="if (event.target === this) closeModal('size-modal')">
        <div class="bg-white rounded-3xl shadow-2xl p-5 w-full max-w-sm flex flex-col gap-3 text-center">
            <h3 class="text-lg font-bold text-slate-800">🔲 화면 크기 고르기</h3>
            <p class="text-sm text-slate-500">칸 수를 바꾸면 그림도 새 크기에 맞게 바뀌어요.</p>
            <div id="grid-size-buttons" class="grid grid-cols-3 gap-2">
                <!-- Buttons injected via JS -->
            </div>
            <button onclick="closeModal('size-modal')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl">닫기</button>
        </div>
    </div>

    <!-- Confirm (지우기 전에 한 번 더 묻기) -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4" onclick="if (event.target === this) closeModal('confirm-modal')">
        <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-sm flex flex-col gap-4 text-center">
            <div class="text-5xl">🤔</div>
            <p id="confirm-text" class="text-lg font-bold text-slate-800"></p>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeModal('confirm-modal')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-4 rounded-2xl text-lg">취소</button>
                <button id="confirm-ok" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-4 rounded-2xl text-lg">지우기</button>
            </div>
        </div>
    </div>

    <!-- Save popup (for tablets that cannot open the share sheet) -->
    <div id="save-popup" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4" onclick="if (event.target === this) closeSavePopup()">
        <div class="bg-white rounded-3xl shadow-2xl p-5 w-full max-w-sm flex flex-col items-center gap-3 text-center">
            <h3 class="text-lg font-bold text-slate-800">📥 갤러리에 저장하기</h3>
            <img id="save-popup-img" alt="저장할 그림" class="w-56 h-56 object-contain rounded-xl border border-slate-200 bg-white">
            <p class="text-sm text-slate-600 leading-relaxed">
                그림을 <b>꾹 길게 눌러</b> <b>'사진에 저장'</b> 또는 <b>'이미지 저장'</b>을 누르세요.
            </p>
            <div class="grid grid-cols-2 gap-2 w-full">
                <button id="save-popup-download" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl text-sm">파일로 저장</button>
                <button onclick="closeSavePopup()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm">닫기</button>
            </div>
        </div>
    </div>

    <!-- Hidden canvas for image processing -->
    <canvas id="processing-canvas" class="hidden"></canvas>

    <!-- JavaScript Application Logic -->
    <script>
        // --- Constants ---
        const PALETTE = [
            { name: '빨강', hex: '#ef4444' },
            { name: '주황', hex: '#f97316' },
            { name: '노랑', hex: '#eab308' },
            { name: '연두', hex: '#84cc16' },
            { name: '초록', hex: '#10b981' },
            { name: '하늘', hex: '#38bdf8' },
            { name: '파랑', hex: '#3b82f6' },
            { name: '남색', hex: '#6366f1' },
            { name: '보라', hex: '#a855f7' },
            { name: '진분홍', hex: '#ec4899' },
            { name: '갈색', hex: '#854d0e' },
            { name: '검정', hex: '#1e293b' }
        ];
        const EMPTY_HEX = '#ffffff';
        const GRID_SIZES = [6, 8, 10, 12, 14, 16];
        const MAX_DETECTED_SIZE = 48;
        const MAX_DESIGN_COLORS = 20;
        const MAX_FRAMES = 8;
        const MAX_HISTORY = 50;

        // --- App State ---
        // (code calls a scene a "frame")
        let gridW = 16;
        let gridH = 16;
        let mode = 'free';              // 'free' | 'trace'
        let frames = [];                // frames[frameIdx][row][col] = hex or null
        let currentFrameIndex = 0;

        let selectedColor = PALETTE[0].hex;
        let selectedColorName = PALETTE[0].name;
        let isEraserActive = false;

        // Trace guides (도안). guideBases are kept at the detected size;
        // guides are the same grids resized to the current screen size.
        let guideBases = [];
        let guides = [];
        let guidePerScene = false;      // true: one guide per scene (animated GIF), false: one guide for all scenes
        let designColors = [];          // colors found in the uploaded design
        let traceCompleted = false;

        let undoStack = [];
        let redoStack = [];
        let pendingSnapshot = null;     // snapshot taken at stroke start
        let isDrawing = false;
        let strokeChanged = false;
        let lastCell = null;

        let frameDelay = 300;           // ms per scene (preview & GIF)
        let previewTimer = null;
        let previewIdx = 0;
        let frameTipShown = false;
        let savePopupUrl = null;

        // --- Initialization ---
        window.onload = function() {
            frames = [createEmptyGrid(gridW, gridH)];
            initGridSizeButtons();
            initPalette();
            bindCanvasEvents();
            bindKeyboard();
            switchMode('free');
            renderFramesTabs();
            updateUndoButtons();
            startPreview();
            // Keep the drawing board as big as the free space allows
            new ResizeObserver(fitCanvas).observe(document.getElementById('canvas-area'));
        };

        // --- Grid helpers ---
        function createEmptyGrid(w, h) {
            return Array.from({ length: h }, () => Array(w).fill(null));
        }

        function cloneGrid(grid) {
            return grid.map(row => row.slice());
        }

        function isGridEmpty(grid) {
            return grid.every(row => row.every(cell => !cell));
        }

        // Nearest-neighbour resample using each new cell's center
        function resampleGrid(oldGrid, newW, newH) {
            const oldH = oldGrid.length, oldW = oldGrid[0].length;
            if (oldW === newW && oldH === newH) return cloneGrid(oldGrid);
            const newGrid = createEmptyGrid(newW, newH);
            for (let r = 0; r < newH; r++) {
                const or = Math.min(oldH - 1, Math.floor((r + 0.5) * oldH / newH));
                for (let c = 0; c < newW; c++) {
                    const oc = Math.min(oldW - 1, Math.floor((c + 0.5) * oldW / newW));
                    newGrid[r][c] = oldGrid[or][oc];
                }
            }
            return newGrid;
        }

        function hexToRgb(hex) {
            return [
                parseInt(hex.substr(1, 2), 16),
                parseInt(hex.substr(3, 2), 16),
                parseInt(hex.substr(5, 2), 16)
            ];
        }

        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
        }

        // Mix a color with white (amount = how much of the color remains)
        function tint(hex, amount) {
            const [r, g, b] = hexToRgb(hex);
            const mix = v => Math.round(255 - (255 - v) * amount);
            return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
        }

        // "redmean" weighted distance: closer to how people see color
        function colorDistance(r1, g1, b1, r2, g2, b2) {
            const rMean = (r1 + r2) / 2;
            const dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
            return Math.sqrt((2 + rMean / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rMean) / 256) * db * db);
        }

        function closestPaletteIndex(r, g, b) {
            let best = 0, bestDist = Infinity;
            PALETTE.forEach((p, i) => {
                const [pr, pg, pb] = hexToRgb(p.hex);
                const dist = colorDistance(r, g, b, pr, pg, pb);
                if (dist < bestDist) { bestDist = dist; best = i; }
            });
            return best;
        }

        // --- Mode ---
        function switchMode(newMode) {
            mode = newMode;
            const base = 'flex-1 py-2.5 rounded-xl text-sm sm:text-base font-bold transition';
            document.getElementById('tab-free').className = `${base} ${mode === 'free' ? 'bg-white shadow-sm text-emerald-600' : 'text-slate-500 hover:text-slate-700'}`;
            document.getElementById('tab-trace').className = `${base} ${mode === 'trace' ? 'bg-white shadow-sm text-amber-600' : 'text-slate-500 hover:text-slate-700'}`;
            document.getElementById('trace-bar').classList.toggle('hidden', mode !== 'trace');
            renderDesignPalette();
            renderCanvas();
            traceCompleted = isCurrentSceneComplete();
            updateTracePanel();
        }

        // --- Screen (grid) Size ---
        function initGridSizeButtons() {
            const container = document.getElementById('grid-size-buttons');
            container.innerHTML = '';
            GRID_SIZES.forEach(sz => {
                const isActive = gridW === sz && gridH === sz;
                const btn = document.createElement('button');
                btn.className = `py-4 rounded-2xl text-base font-bold border-2 transition ${isActive ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-white text-slate-700 border-emerald-200 hover:bg-emerald-100'}`;
                btn.innerText = `${sz}×${sz}`;
                btn.onclick = () => { closeModal('size-modal'); changeGridSize(sz, sz); };
                container.appendChild(btn);
            });
            document.getElementById('current-grid-badge').innerText = `${gridW}×${gridH}`;
        }

        function openSizePicker() {
            openModal('size-modal');
        }

        function changeGridSize(newW, newH) {
            if (newW === gridW && newH === gridH) return;
            const snap = snapshot();
            const hadDrawing = frames.some(f => !isGridEmpty(f));

            setGridSize(newW, newH);
            commit(snap);
            renderAll();
            if (hadDrawing) {
                showToast('그림을 새 화면 크기에 맞게 옮겼어요. 마음에 안 들면 되돌리기!');
            }
        }

        // Resize scenes + guides (no history; callers handle undo)
        function setGridSize(newW, newH) {
            frames = frames.map(f => resampleGrid(f, newW, newH));
            gridW = newW;
            gridH = newH;
            refreshGuideSize();
            initGridSizeButtons();
        }

        function refreshGuideSize() {
            guides = guideBases.map(g => g ? resampleGrid(g, gridW, gridH) : null);
            traceCompleted = false;
        }

        // Guide for a scene (null if none)
        function guideFor(index) {
            if (guides.length === 0) return null;
            return guidePerScene ? (guides[index] || null) : guides[0];
        }

        function hasAnyGuide() {
            return guides.some(Boolean);
        }

        // --- Palette & Tools ---
        function makeSwatch(hex, name) {
            const btn = document.createElement('button');
            btn.style.backgroundColor = hex;
            btn.title = name;
            btn.dataset.hex = hex;
            btn.onclick = () => selectColor(hex, name);
            return btn;
        }

        function initPalette() {
            const container = document.getElementById('color-palette');
            container.innerHTML = '';
            PALETTE.forEach(item => container.appendChild(makeSwatch(item.hex, item.name)));
            updateToolUI();
        }

        function renderDesignPalette() {
            const wrap = document.getElementById('design-palette-wrap');
            const container = document.getElementById('design-palette');
            container.innerHTML = '';
            const show = mode === 'trace' && designColors.length > 0;
            wrap.classList.toggle('hidden', !show);
            wrap.classList.toggle('flex', show);
            designColors.forEach((hex, i) => container.appendChild(makeSwatch(hex, `도안 색 ${i + 1}`)));
            updateToolUI();
        }

        function selectColor(hex, name) {
            isEraserActive = false;
            selectedColor = hex;
            selectedColorName = name;
            updateToolUI();
        }

        function setEraser() {
            isEraserActive = true;
            updateToolUI();
        }

        function updateToolUI() {
            const swatches = document.querySelectorAll('#color-palette button, #design-palette button');
            swatches.forEach(btn => {
                const isSelected = !isEraserActive && btn.dataset.hex === selectedColor;
                btn.className = `w-full h-11 sm:h-12 rounded-xl transition shadow-sm ${isSelected ? 'ring-4 ring-slate-800 ring-offset-2 scale-105' : 'border-2 border-black/10'}`;
            });
            document.getElementById('eraser-btn').className = isEraserActive
                ? 'tool-btn bg-slate-700 text-white ring-4 ring-slate-400'
                : 'tool-btn bg-slate-200 hover:bg-slate-300 text-slate-700';

            // Big "current color" dot so students always see what they paint with
            const dot = document.getElementById('current-color-dot');
            dot.classList.toggle('eraser-dot', isEraserActive);
            dot.style.backgroundColor = isEraserActive ? '' : selectedColor;
            document.getElementById('selected-color-label').innerText = isEraserActive
                ? '지금 도구: 🧽 지우개'
                : `지금 색: ${selectedColorName}`;
        }

        // --- Canvas Rendering ---
        function renderAll() {
            renderFramesTabs();
            renderCanvas();
            updateTracePanel();
            updateUndoButtons();
        }

        function renderCanvas() {
            const canvasEl = document.getElementById('pixel-canvas');
            canvasEl.style.gridTemplateColumns = `repeat(${gridW}, minmax(0, 1fr))`;
            canvasEl.style.gridTemplateRows = `repeat(${gridH}, minmax(0, 1fr))`;
            fitCanvas();

            const frag = document.createDocumentFragment();
            for (let r = 0; r < gridH; r++) {
                for (let c = 0; c < gridW; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'pixel-cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    refreshCell(cell, r, c);
                    frag.appendChild(cell);
                }
            }
            canvasEl.replaceChildren(frag);
        }

        // Size the board to the largest size that fits the free space (keeps cells square)
        function fitCanvas() {
            const area = document.getElementById('canvas-area');
            const canvasEl = document.getElementById('pixel-canvas');
            const pad = 12;
            const aw = area.clientWidth - pad * 2;
            const ah = area.clientHeight - pad * 2;
            if (aw <= 0 || ah <= 0) return;
            const w = Math.min(aw, ah * gridW / gridH);
            canvasEl.style.width = `${Math.floor(w)}px`;
            canvasEl.style.height = `${Math.floor(w * gridH / gridW)}px`;
        }

        // --- Popups ---
        function openModal(id) {
            const el = document.getElementById(id);
            el.classList.remove('hidden');
            el.classList.add('flex');
        }

        function closeModal(id) {
            const el = document.getElementById(id);
            el.classList.add('hidden');
            el.classList.remove('flex');
        }

        // Ask once more before deleting (students may tap by mistake)
        function confirmAction(message, okLabel, onOk) {
            document.getElementById('confirm-text').innerText = message;
            const okBtn = document.getElementById('confirm-ok');
            okBtn.innerText = okLabel;
            okBtn.onclick = () => { closeModal('confirm-modal'); onOk(); };
            openModal('confirm-modal');
        }

        function refreshCell(el, r, c) {
            const color = frames[currentFrameIndex][r][c];
            const guide = mode === 'trace' ? guideFor(currentFrameIndex) : null;
            const target = guide ? guide[r][c] : null;

            if (color) {
                el.style.backgroundColor = color;
            } else if (target) {
                el.style.backgroundColor = tint(target, 0.28);
            } else {
                el.style.backgroundColor = EMPTY_HEX;
            }
            // Show the target color dot until the cell has the right color
            const showDot = !!target && color !== target;
            el.classList.toggle('guide', showDot);
            if (showDot) el.style.setProperty('--g', target);
        }

        function getCellEl(r, c) {
            return document.getElementById('pixel-canvas').children[r * gridW + c];
        }

        // --- Drawing (pointer events: mouse, touch, pen) ---
        function bindCanvasEvents() {
            const canvasEl = document.getElementById('pixel-canvas');

            canvasEl.addEventListener('pointerdown', (e) => {
                const cell = e.target.closest('.pixel-cell');
                if (!cell) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                e.preventDefault();
                beginStroke();
                const r = +cell.dataset.r, c = +cell.dataset.c;
                applyColor(r, c);
                lastCell = [r, c];
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDrawing) return;
                const el = document.elementFromPoint(e.clientX, e.clientY);
                const cell = el && el.closest ? el.closest('.pixel-cell') : null;
                if (!cell || !canvasEl.contains(cell)) return;
                const r = +cell.dataset.r, c = +cell.dataset.c;
                // Fill the gap between cells when the pointer moves fast
                if (lastCell) {
                    drawLine(lastCell[0], lastCell[1], r, c, applyColor);
                } else {
                    applyColor(r, c);
                }
                lastCell = [r, c];
            });

            window.addEventListener('pointerup', endStroke);
            window.addEventListener('pointercancel', endStroke);
            canvasEl.addEventListener('contextmenu', (e) => e.preventDefault());
        }

        function drawLine(r0, c0, r1, c1, fn) {
            const dx = Math.abs(c1 - c0), dy = -Math.abs(r1 - r0);
            const sx = c0 < c1 ? 1 : -1, sy = r0 < r1 ? 1 : -1;
            let err = dx + dy;
            while (true) {
                fn(r0, c0);
                if (r0 === r1 && c0 === c1) break;
                const e2 = 2 * err;
                if (e2 >= dy) { err += dy; c0 += sx; }
                if (e2 <= dx) { err += dx; r0 += sy; }
            }
        }

        function beginStroke() {
            pendingSnapshot = snapshot();
            isDrawing = true;
            strokeChanged = false;
        }

        function endStroke() {
            if (!isDrawing) return;
            isDrawing = false;
            lastCell = null;
            if (strokeChanged) {
                commit(pendingSnapshot);
                updateFrameThumbnail(currentFrameIndex);
            }
            pendingSnapshot = null;
        }

        function applyColor(r, c) {
            const value = isEraserActive ? null : selectedColor;
            if (frames[currentFrameIndex][r][c] === value) return;
            frames[currentFrameIndex][r][c] = value;
            strokeChanged = true;
            refreshCell(getCellEl(r, c), r, c);
            if (mode === 'trace') updateTracePanel();
        }

        // 비우기: clears the current scene AND removes the 도안, so the screen is all white
        function clearCanvas() {
            const hadGuide = guideBases.length > 0;
            if (isGridEmpty(frames[currentFrameIndex]) && !hadGuide) {
                showToast('이미 비어 있어요!');
                return;
            }
            confirmAction(
                hadGuide ? '그림과 도안을 모두 지울까요?' : `${currentFrameIndex + 1}번 장면 그림을 모두 지울까요?`,
                '지우기',
                () => doClearCanvas(hadGuide)
            );
        }

        function doClearCanvas(hadGuide) {
            const snap = snapshot();
            frames[currentFrameIndex] = createEmptyGrid(gridW, gridH);
            if (hadGuide) {
                if (designColors.includes(selectedColor)) selectColor(PALETTE[0].hex, PALETTE[0].name);
                guideBases = [];
                guidePerScene = false;
                designColors = [];
                refreshGuideSize();
                renderDesignPalette();
            }
            commit(snap);
            renderAll();
            showToast(hadGuide
                ? '도안까지 모두 지웠어요. 다시 하려면 도안을 올려 주세요. (되돌리기 가능)'
                : '깨끗하게 비웠어요! (되돌리기 가능)');
        }

        // --- Undo / Redo ---
        function snapshot() {
            return {
                gridW,
                gridH,
                currentFrameIndex,
                frames: frames.map(cloneGrid),
                // guide grids are never modified in place, so sharing references is safe
                guideBases: guideBases.slice(),
                guidePerScene,
                designColors: designColors.slice()
            };
        }

        function commit(snap) {
            undoStack.push(snap);
            if (undoStack.length > MAX_HISTORY) undoStack.shift();
            redoStack = [];
            updateUndoButtons();
        }

        function restore(snap) {
            const sizeChanged = snap.gridW !== gridW || snap.gridH !== gridH;
            gridW = snap.gridW;
            gridH = snap.gridH;
            frames = snap.frames.map(cloneGrid);
            currentFrameIndex = Math.min(snap.currentFrameIndex, frames.length - 1);
            guideBases = snap.guideBases.slice();
            guidePerScene = snap.guidePerScene;
            designColors = snap.designColors.slice();
            if (sizeChanged) initGridSizeButtons();
            refreshGuideSize();
            traceCompleted = isCurrentSceneComplete();
            renderDesignPalette();
            renderAll();
        }

        function undo() {
            if (isDrawing || undoStack.length === 0) return;
            redoStack.push(snapshot());
            restore(undoStack.pop());
        }

        function redo() {
            if (isDrawing || redoStack.length === 0) return;
            undoStack.push(snapshot());
            restore(redoStack.pop());
        }

        function updateUndoButtons() {
            document.getElementById('undo-btn').disabled = undoStack.length === 0;
            document.getElementById('redo-btn').disabled = redoStack.length === 0;
        }

        function bindKeyboard() {
            window.addEventListener('keydown', (e) => {
                if (!(e.ctrlKey || e.metaKey)) return;
                const key = e.key.toLowerCase();
                if (key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
                else if (key === 'y' || (key === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
            });
        }

        // --- Scene (frame) Management ---
        function addNewFrame() {
            if (frames.length >= MAX_FRAMES) {
                showToast(`최대 ${MAX_FRAMES}장면까지 만들 수 있어요.`);
                return;
            }
            const snap = snapshot();
            const insertAt = currentFrameIndex + 1;
            // Copy the current scene so the next pose can be made by small changes
            frames.splice(insertAt, 0, cloneGrid(frames[currentFrameIndex]));
            // Per-scene guides follow their scenes; the new scene gets the same guide
            if (guidePerScene && insertAt <= guideBases.length) {
                guideBases.splice(insertAt, 0, guideBases[currentFrameIndex] || null);
                refreshGuideSize();
            }
            currentFrameIndex = insertAt;
            commit(snap);
            traceCompleted = isCurrentSceneComplete();
            renderAll();
            if (!frameTipShown) {
                frameTipShown = true;
                showToast('지금 그림을 복사했어요. 조금씩 바꿔서 움직이게 만들어 보세요!');
            }
        }

        function selectFrame(index) {
            currentFrameIndex = index;
            traceCompleted = isCurrentSceneComplete();
            renderFramesTabs();
            renderCanvas();
            updateTracePanel();
        }

        function deleteFrame(index, e) {
            e.stopPropagation();
            if (frames.length <= 1) {
                showToast('최소 1개의 장면은 있어야 해요.');
                return;
            }
            confirmAction(`${index + 1}번 장면을 지울까요?`, '지우기', () => doDeleteFrame(index));
        }

        function doDeleteFrame(index) {
            const snap = snapshot();
            frames.splice(index, 1);
            if (guidePerScene && index < guideBases.length) {
                guideBases.splice(index, 1);
                refreshGuideSize();
            }
            if (currentFrameIndex > index || currentFrameIndex >= frames.length) {
                currentFrameIndex = Math.max(0, currentFrameIndex - 1);
            }
            commit(snap);
            traceCompleted = isCurrentSceneComplete();
            renderAll();
        }

        function renderFramesTabs() {
            const tabsContainer = document.getElementById('frame-tabs');
            tabsContainer.innerHTML = '';
            frames.forEach((_, idx) => {
                const isActive = idx === currentFrameIndex;
                const tab = document.createElement('div');
                tab.className = `relative flex flex-col items-center gap-0.5 p-1.5 rounded-xl border-2 text-xs font-bold cursor-pointer transition ${isActive ? 'bg-sky-500 text-white border-sky-500 shadow-sm' : 'bg-white text-slate-700 border-slate-200 hover:bg-sky-50'}`;
                tab.title = `${idx + 1}번 장면`;
                tab.onclick = () => selectFrame(idx);

                const thumb = document.createElement('canvas');
                thumb.id = `thumb-${idx}`;
                thumb.className = 'pixelated w-9 h-9 rounded bg-white border border-slate-200';
                tab.appendChild(thumb);

                const label = document.createElement('span');
                label.innerText = `${idx + 1}번`;
                tab.appendChild(label);

                // Delete button only on the selected scene, so it is hard to hit by mistake
                if (isActive && frames.length > 1) {
                    const delBtn = document.createElement('button');
                    delBtn.innerText = '✕';
                    delBtn.className = 'absolute -top-2 -right-2 w-7 h-7 rounded-full bg-rose-500 text-white text-xs font-bold shadow border-2 border-white';
                    delBtn.title = '장면 지우기';
                    delBtn.onclick = (e) => deleteFrame(idx, e);
                    tab.appendChild(delBtn);
                }

                tabsContainer.appendChild(tab);
                updateFrameThumbnail(idx);
            });
        }

        function updateFrameThumbnail(index) {
            const thumb = document.getElementById(`thumb-${index}`);
            if (!thumb || !frames[index]) return;
            thumb.width = gridW;
            thumb.height = gridH;
            drawGridToCanvas(thumb.getContext('2d'), frames[index], 1);
        }

        // --- Live Preview ---
        function startPreview() {
            if (previewTimer) clearInterval(previewTimer);
            const canvas = document.getElementById('preview-canvas');
            const tick = () => {
                if (previewIdx >= frames.length) previewIdx = 0;
                canvas.width = gridW;
                canvas.height = gridH;
                drawGridToCanvas(canvas.getContext('2d'), frames[previewIdx], 1);
                previewIdx++;
            };
            tick();
            previewTimer = setInterval(tick, frameDelay);
        }

        function changeSpeed(value) {
            frameDelay = parseInt(value, 10);
            startPreview();
        }

        // --- Trace (따라그리기) ---
        function fillFromGuide() {
            const guide = guideFor(currentFrameIndex);
            if (!guide) {
                showToast('이 장면에는 도안이 없어요.');
                return;
            }
            const snap = snapshot();
            frames[currentFrameIndex] = cloneGrid(guide);
            commit(snap);
            traceCompleted = true; // filled automatically, so skip the celebration
            renderCanvas();
            updateFrameThumbnail(currentFrameIndex);
            updateTracePanel();
            showToast('도안 색을 그대로 채웠어요. 되돌리기로 취소할 수 있어요.');
        }

        function sceneProgress(index) {
            const guide = guideFor(index);
            if (!guide) return null;
            const grid = frames[index];
            let total = 0, done = 0;
            for (let r = 0; r < gridH; r++) {
                for (let c = 0; c < gridW; c++) {
                    if (!guide[r][c]) continue;
                    total++;
                    if (grid[r][c] === guide[r][c]) done++;
                }
            }
            return { total, done };
        }

        function isCurrentSceneComplete() {
            const p = sceneProgress(currentFrameIndex);
            return !!p && p.total > 0 && p.done === p.total;
        }

        function updateTracePanel() {
            const progressEl = document.getElementById('trace-progress');
            const anyGuide = hasAnyGuide();
            document.getElementById('trace-empty').classList.toggle('hidden', anyGuide);
            progressEl.classList.toggle('hidden', !anyGuide);
            progressEl.classList.toggle('flex', anyGuide);
            const p = anyGuide ? sceneProgress(currentFrameIndex) : null;
            document.getElementById('fill-guide-btn').classList.toggle('hidden', !p);
            if (!anyGuide) return;

            const textEl = document.getElementById('trace-progress-text');
            const barEl = document.getElementById('trace-progress-bar');
            const prefix = guidePerScene ? `${currentFrameIndex + 1}번 장면` : '따라그리기';
            if (!p) {
                textEl.innerText = `${currentFrameIndex + 1}번 장면에는 도안이 없어요`;
                barEl.style.width = '0%';
                return;
            }
            const pct = p.total ? Math.round(p.done / p.total * 100) : 0;
            textEl.innerText = `${prefix}: ${p.done} / ${p.total}칸 (${pct}%)`;
            barEl.style.width = `${pct}%`;

            if (p.total > 0 && p.done === p.total) {
                if (!traceCompleted && mode === 'trace') {
                    traceCompleted = true;
                    celebrate();
                }
            } else {
                traceCompleted = false;
            }
        }

        function celebrate() {
            if (!guidePerScene) {
                showToast('🎉 도안 따라그리기 완성! 정말 잘했어요!');
                return;
            }
            const remaining = [];
            frames.forEach((_, i) => {
                const p = sceneProgress(i);
                if (p && p.total > 0 && p.done < p.total) remaining.push(i + 1);
            });
            showToast(remaining.length === 0
                ? '🎉 모든 장면 완성! 움직이는 사진으로 저장해 보세요!'
                : `🎉 ${currentFrameIndex + 1}번 장면 완성! 다음은 ${remaining[0]}번 장면이에요.`);
        }

        // --- Design Upload ---
        function handleImageUpload(event) {
            const file = event.target.files[0];
            event.target.value = ''; // allow re-uploading the same file
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                const bytes = new Uint8Array(reader.result);
                const isGif = bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46; // "GIF"
                if (isGif) {
                    try {
                        const gif = decodeGIF(bytes);
                        if (gif.frames.length > 0) {
                            readDesignLater(gif.frames.map(f => frameToCanvas(f, gif.width, gif.height)));
                            return;
                        }
                    } catch (err) {
                        // Fall back to the browser's decoder (first scene only)
                    }
                }
                // Read as a data URL: works everywhere, including a file opened directly
                // or a preview window (blob: URLs can be blocked there)
                const urlReader = new FileReader();
                urlReader.onload = () => {
                    const img = new Image();
                    img.onload = () => readDesignLater([img]);
                    img.onerror = () => showToast('이미지를 열 수 없어요. 사진 파일(PNG, JPG, GIF)인지 확인해 주세요.');
                    img.src = urlReader.result;
                };
                urlReader.readAsDataURL(file);
            };
            reader.readAsArrayBuffer(file);
        }

        function frameToCanvas(rgba, w, h) {
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').putImageData(new ImageData(rgba, w, h), 0, 0);
            return canvas;
        }

        // sources: one image, or one canvas per scene of an animated GIF
        // Reading a design takes a moment on tablets: show a message first, then work
        function readDesignLater(sources) {
            showToast('🔍 도안을 읽고 있어요...');
            setTimeout(() => applyDesign(sources), 60);
        }

        function applyDesign(sources) {
            let truncated = false;
            if (sources.length > MAX_FRAMES) {
                sources = sources.slice(0, MAX_FRAMES);
                truncated = true;
            }
            const result = analyzeDesign(sources);
            if (result.grids.every(isGridEmpty)) {
                showToast('색칠된 칸을 찾지 못했어요. 더 선명한 도안을 올려 주세요.');
                return;
            }

            const snap = snapshot();
            guideBases = result.grids;
            guidePerScene = result.grids.length > 1;
            designColors = result.colors;

            if (result.w !== gridW || result.h !== gridH) {
                setGridSize(result.w, result.h);
            } else {
                refreshGuideSize();
            }
            if (guidePerScene) {
                // One scene per design scene
                while (frames.length < guideBases.length) frames.push(createEmptyGrid(gridW, gridH));
                currentFrameIndex = 0;
            }
            commit(snap);

            if (designColors.length) selectColor(designColors[0], '도안 색 1');
            traceCompleted = isCurrentSceneComplete();
            renderDesignPalette();
            renderAll();

            let msg;
            if (guidePerScene) {
                msg = `${guideBases.length}장면짜리 움직이는 도안을 찾았어요! 장면마다 따라 그려 보세요.`;
                if (truncated) msg += ` (최대 ${MAX_FRAMES}장면까지만 불러왔어요)`;
            } else if (result.detected) {
                msg = `${result.w}×${result.h} 도안을 찾았어요! 흐린 칸 위에 따라 그려 보세요.`;
            } else {
                msg = `격자선을 찾지 못해서 그림 전체를 ${result.w}×${result.h}칸으로 나눴어요.`;
            }
            showToast(msg);
        }

        // Read the pixels of an image/canvas (downscaled, on white so transparency = paper)
        function readImagePixels(src) {
            // Work at about 1000 px: big pictures are shrunk, small ones enlarged
            // (tiny pictures have cells only a few pixels wide, too small to find the lines)
            const MAX_SIDE = 1000;
            const scale = MAX_SIDE / Math.max(src.width, src.height);
            const w = Math.max(1, Math.round(src.width * scale));
            const h = Math.max(1, Math.round(src.height * scale));
            const canvas = document.getElementById('processing-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            canvas.width = w;
            canvas.height = h;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(src, 0, 0, w, h);
            return { w, h, data: ctx.getImageData(0, 0, w, h).data };
        }

        // Find the grid on the first scene, read every scene with the same grid,
        // and build one shared set of design colors.
        function analyzeDesign(sources) {
            const first = readImagePixels(sources[0]);
            // 1) worksheet-style grids (thin/thick/pale lines, text, legends, coloured cells)
            let box = detectGrid(first), detected = true;
            if (box) box = dropNumberHeaders(first, box);
            if (!box) {
                // 2) simple grey/black grid lines
                const rows = detectGridAxis(first, 'y');
                const cols = detectGridAxis(first, 'x');
                if (rows && cols) {
                    box = { x0: cols.start, x1: cols.end, y0: rows.start, y1: rows.end, w: cols.count, h: rows.count };
                }
            }
            if (!box) {
                // No grid lines (e.g. a picture saved from this app): the whole image is the grid.
                // Find the cell count from where colors change; fall back to the current size.
                const bw = detectBlockCount(first, 'x', gridW);
                const bh = detectBlockCount(first, 'y', gridH);
                detected = !!(bw && bh);
                box = { x0: 0, x1: first.w, y0: 0, y1: first.h, w: bw || gridW, h: bh || gridH };
            }

            const allCells = [];
            sources.forEach((src, i) => {
                const px = i === 0 ? first : readImagePixels(src);
                allCells.push(...sampleCells(px, box));
            });
            const { grid, colors } = groupColors(allCells);

            const grids = [];
            for (let i = 0; i < sources.length; i++) {
                grids.push(grid.slice(i * box.h, (i + 1) * box.h));
            }
            return { grids, colors, w: box.w, h: box.h, detected };
        }

        // Many charts number the columns/rows (1, 2, 3 ...) in an extra first row/column.
        // Such a row is blank cells with small dark marks, while the rest of the blank cells are clean.
        // (Number worksheets, where every blank cell has a "0", are left alone.)
        function dropNumberHeaders(px, box) {
            const { w, data } = px;
            const cw = (box.x1 - box.x0) / box.w, ch = (box.y1 - box.y0) / box.h;
            const lum = (i) => data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11;
            // per cell: is it blank (light), and does it carry dark marks (digits)?
            const info = (r, c) => {
                let light = 0, dark = 0, colourful = 0, n = 0;
                for (let sy = 0; sy < 10; sy++) {
                    for (let sx = 0; sx < 10; sx++) {
                        const x = Math.floor(box.x0 + (c + 0.2 + 0.6 * (sx + 0.5) / 10) * cw);
                        const y = Math.floor(box.y0 + (r + 0.2 + 0.6 * (sy + 0.5) / 10) * ch);
                        if (x < 0 || y < 0 || x >= w || y >= px.h) continue;
                        const i = (y * w + x) * 4;
                        const v = lum(i);
                        n++;
                        if (v > 200) light++;
                        else if (v < 140) dark++;
                        if (Math.max(data[i], data[i + 1], data[i + 2]) - Math.min(data[i], data[i + 1], data[i + 2]) > 70) colourful++;
                    }
                }
                if (!n) return { blank: false, marked: false };
                // "blank" = mostly white paper, maybe with dark writing, not a filled (coloured/black) cell
                // (screen text can have coloured edges, so a little colour is allowed)
                return {
                    blank: light / n > 0.4 && dark / n < 0.5 && colourful / n < 0.3,
                    marked: dark / n > 0.03
                };
            };
            const cells = [];
            for (let r = 0; r < box.h; r++) {
                const row = [];
                for (let c = 0; c < box.w; c++) row.push(info(r, c));
                cells.push(row);
            }
            const share = (list) => {
                const blanks = list.filter(i => i.blank);
                return blanks.length ? blanks.filter(i => i.marked).length / blanks.length : 0;
            };
            const inner = [];
            for (let r = 1; r < box.h; r++) for (let c = 1; c < box.w; c++) inner.push(cells[r][c]);
            if (share(inner) > 0.2) return box; // blank cells are numbered everywhere

            const result = { ...box };
            const firstRow = cells[0].slice(1), firstCol = cells.slice(1).map(row => row[0]);
            const looksLikeHeader = (list) => list.filter(i => i.blank).length >= list.length * 0.8 && share(list) >= 0.6;
            if (box.h > 3 && looksLikeHeader(firstRow)) { result.y0 += ch; result.h--; }
            if (box.w > 3 && looksLikeHeader(firstCol)) { result.x0 += cw; result.w--; }
            return result;
        }

        // --- Grid finder for worksheet / internet designs ---
        // Idea: find thin-line pixels, get the line spacing from how the line counts repeat,
        // then find where the grid is (the area that many evenly spaced lines cross).
        // Returns { x0, x1, y0, y1, w, h } or null.
        function detectGrid(px) {
            const { w, h } = px;
            const { V, H } = findLinePixels(px);

            // First pass ignores a thin margin (page edges, decorative borders)
            const mx = Math.round(w * 0.03), my = Math.round(h * 0.03);
            let box = { x0: mx, x1: w - mx, y0: my, y1: h - my };
            let result = null;
            for (let pass = 0; pass < 2; pass++) {
                const profX = lineProfile(V, w, 'x', box);
                const profY = lineProfile(H, w, 'y', box);
                const roughX = roughPitch(profX, box.x0, box.x1);
                const roughY = roughPitch(profY, box.y0, box.y1);
                if (!roughX || !roughY) break;
                const fx = finePitch(profX, box.x0, box.x1, roughX);
                const fy = finePitch(profY, box.y0, box.y1, roughY);

                // Candidate line positions across the whole image
                const vx = [], hy = [];
                for (let x = fx.phase - Math.floor(fx.phase / fx.pitch) * fx.pitch; x < w; x += fx.pitch) vx.push(x);
                for (let y = fy.phase - Math.floor(fy.phase / fy.pitch) * fy.pitch; y < h; y += fy.pitch) hy.push(y);
                const rowsSpan = gridSpan(V, w, h, 'x', vx, fy.pitch); // rows crossed by vertical lines
                const colsSpan = gridSpan(H, w, h, 'y', hy, fx.pitch); // columns crossed by horizontal lines
                if (!rowsSpan || !colsSpan) break;

                const X = fitGridLines(profX, fx.pitch, fx.phase, colsSpan.from, colsSpan.to);
                const Y = fitGridLines(profY, fy.pitch, fy.phase, rowsSpan.from, rowsSpan.to);
                if (!X || !Y) break;
                result = { x0: X.start, x1: X.end, y0: Y.start, y1: Y.end, w: X.count, h: Y.count };

                // Second pass: measure again inside the found grid only
                const m = 3;
                box = {
                    x0: Math.max(0, Math.floor(X.start) - m), x1: Math.min(w, Math.ceil(X.end) + m),
                    y0: Math.max(0, Math.floor(Y.start) - m), y1: Math.min(h, Math.ceil(Y.end) + m)
                };
            }
            // The first pass can be rough; only the final answer has to be a sensible grid
            if (!result || result.w < 2 || result.h < 2 || result.w > MAX_DETECTED_SIZE || result.h > MAX_DETECTED_SIZE) return null;
            return result;
        }

        // Line pixels: brighter or darker than BOTH neighbours (a ridge), checked at several widths.
        // V = part of a vertical line, H = part of a horizontal line.
        function findLinePixels(px) {
            const { w, h, data } = px;
            const T = 45, TL = 12;
            const dist = (a, b) => Math.abs(data[a] - data[b]) + Math.abs(data[a + 1] - data[b + 1]) + Math.abs(data[a + 2] - data[b + 2]);
            const lum = (a) => data[a] * 0.3 + data[a + 1] * 0.59 + data[a + 2] * 0.11;
            const isRidge = (i, l, r) => {
                // pale lines: slightly brighter/darker than both sides
                const a = lum(i) - lum(l), b = lum(i) - lum(r);
                if ((a > TL && b > TL) || (a < -TL && b < -TL)) return true;
                // a grey line on a coloured cell can have the same brightness, so compare colours too
                const dl = dist(i, l), dr = dist(i, r);
                return dl > T && dr > T && dist(l, r) < Math.min(dl, dr) * 0.8;
            };
            const Vr = new Uint8Array(w * h), Hr = new Uint8Array(w * h);
            const widths = [1, 2, 3, 5]; // thin and thick lines
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const i = y * w + x, b = i * 4;
                    for (const D of widths) {
                        if (!Vr[i] && x - D >= 0 && x + D < w && isRidge(b, b - D * 4, b + D * 4)) Vr[i] = 1;
                        if (!Hr[i] && y - D >= 0 && y + D < h && isRidge(b, b - D * w * 4, b + D * w * 4)) Hr[i] = 1;
                    }
                }
            }
            // Drop dense repeating textures (dotted borders): line pixels 7 px away on BOTH sides
            const S = 7;
            const V = new Uint8Array(w * h), H = new Uint8Array(w * h);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const i = y * w + x;
                    if (Vr[i] && !(x - S >= 0 && x + S < w && Vr[i - S] && Vr[i + S])) V[i] = 1;
                    if (Hr[i] && !(y - S >= 0 && y + S < h && Hr[i - S * w] && Hr[i + S * w])) H[i] = 1;
                }
            }
            // Keep only long straight runs (grid lines), not short strokes of letters and numbers
            keepLongRuns(V, w, h, 'y', Math.max(6, Math.round(h * 0.012)));
            keepLongRuns(H, w, h, 'x', Math.max(6, Math.round(w * 0.012)));
            return { V, H };
        }

        // Clear runs shorter than minLen along one direction (1 px gaps are bridged)
        function keepLongRuns(map, w, h, dir, minLen) {
            const outer = dir === 'y' ? w : h, inner = dir === 'y' ? h : w;
            const idx = (o, t) => dir === 'y' ? t * w + o : o * w + t;
            for (let o = 0; o < outer; o++) {
                let t = 0;
                while (t < inner) {
                    if (!map[idx(o, t)]) { t++; continue; }
                    let end = t;
                    while (end + 1 < inner && (map[idx(o, end + 1)] || (end + 2 < inner && map[idx(o, end + 2)]))) end++;
                    if (end - t + 1 < minLen) {
                        for (let u = t; u <= end; u++) map[idx(o, u)] = 0;
                    }
                    t = end + 1;
                }
            }
        }

        // Number of line pixels per column ('x') or per row ('y'), counted inside a box
        function lineProfile(map, w, axis, box) {
            const p = new Float32Array(axis === 'x' ? w : map.length / w);
            for (let y = box.y0; y < box.y1; y++) {
                for (let x = box.x0; x < box.x1; x++) {
                    if (map[y * w + x]) p[axis === 'x' ? x : y]++;
                }
            }
            return p;
        }

        function peakNear(p, pos) {
            const k = Math.round(pos);
            return Math.max(p[k - 1] || 0, p[k] || 0, p[k + 1] || 0);
        }

        // Whole-pixel line spacing from autocorrelation (first strong peak, so doubles are skipped).
        // Pictures are worked on at ~1000 px, so cells are at least ~10 px; smaller repeats are
        // textures (dotted borders, double lines).
        const MIN_PITCH = 10;
        function roughPitch(p, a, b) {
            const len = b - a;
            let mean = 0;
            for (let i = a; i < b; i++) mean += p[i];
            mean /= len;
            const q = new Float32Array(len);
            let energy = 0;
            for (let i = 0; i < len; i++) { q[i] = p[a + i] - mean; energy += q[i] * q[i]; }
            if (!energy) return null;
            const r = [];
            const maxL = Math.floor(len / 3);
            for (let L = MIN_PITCH - 1; L <= maxL + 1; L++) {
                let s = 0;
                for (let i = 0; i + L < len; i++) s += q[i] * q[i + L];
                r[L] = s / energy;
            }
            let maxR = -Infinity;
            for (let L = MIN_PITCH; L <= maxL; L++) if (r[L] > maxR) maxR = r[L];
            if (!(maxR > 0.1)) return null;
            for (let L = MIN_PITCH; L <= maxL; L++) {
                if (r[L] >= r[L - 1] && r[L] >= r[L + 1] && r[L] >= 0.6 * maxR) return L;
            }
            return null;
        }

        // Exact (sub-pixel) spacing and offset that best line up with the line peaks
        function finePitch(p, a, b, rough) {
            let best = { score: -1 };
            for (let pitch = rough - 1; pitch <= rough + 1.001; pitch += 0.05) {
                for (let o = 0; o < pitch; o += 0.5) {
                    let s = 0;
                    for (let x = a + o; x < b; x += pitch) s += peakNear(p, x);
                    if (s > best.score) best = { score: s, pitch, phase: a + o };
                }
            }
            return best;
        }

        // Where the grid is along one axis: the positions crossed by many of the candidate lines.
        // axis 'x' = vertical lines at x = lines[], measured for every row.
        function gridSpan(map, w, h, axis, lines, crossPitch) {
            const len = axis === 'x' ? h : w;
            const lineLen = axis === 'x' ? w : h;
            const cov = new Float32Array(len);
            for (let t = 0; t < len; t++) {
                let c = 0;
                for (const pos of lines) {
                    const k = Math.round(pos);
                    for (let d = -1; d <= 1; d++) {
                        const u = k + d;
                        if (u < 0 || u >= lineLen) continue;
                        if (map[axis === 'x' ? t * w + u : u * w + t]) { c++; break; }
                    }
                }
                cov[t] = c;
            }
            const sorted = Array.from(cov).sort((x, y) => y - x);
            const ref = sorted[Math.floor(len * 0.05)] || sorted[0];
            if (ref < 3) return null;
            // Split into parts separated by "dead" stretches (almost no lines for over a cell),
            // e.g. a second grid or a colour table further down. Rows of filled cells can hide most
            // lines, so inside a part only the first and last well-covered positions matter.
            const deadLen = Math.max(4, Math.round(crossPitch * 0.6));
            const parts = [];
            let partStart = -1, deadRun = 0;
            for (let t = 0; t <= len; t++) {
                const alive = t < len && cov[t] >= ref * 0.1;
                if (alive) {
                    if (partStart < 0) partStart = t;
                    deadRun = 0;
                } else if (partStart >= 0) {
                    deadRun++;
                    if (deadRun > deadLen || t === len) {
                        parts.push([partStart, t - deadRun]);
                        partStart = -1;
                        deadRun = 0;
                    }
                }
            }
            let best = null;
            for (const [a, b] of parts) {
                let from = -1, to = -1;
                for (let t = a; t <= b; t++) {
                    if (cov[t] >= ref * 0.5) { if (from < 0) from = t; to = t; }
                }
                if (from >= 0 && (!best || to - from > best.to - best.from)) best = { from, to };
            }
            return best;
        }

        // Snap a span to the nearest grid lines, then refine with a straight-line fit
        function fitGridLines(p, pitch, phase, from, to) {
            const kFrom = Math.round((from - phase) / pitch), kTo = Math.round((to - phase) / pitch);
            const ks = [], xs = [];
            for (let k = kFrom; k <= kTo; k++) {
                const expected = Math.round(phase + k * pitch);
                let bx = expected, bv = -1;
                for (let d = -2; d <= 2; d++) {
                    if ((p[expected + d] || 0) > bv) { bv = p[expected + d] || 0; bx = expected + d; }
                }
                ks.push(k);
                xs.push(bx);
            }
            const n = ks.length;
            if (n < 3) return null;
            const mk = ks.reduce((s, v) => s + v, 0) / n, mx = xs.reduce((s, v) => s + v, 0) / n;
            let num = 0, den = 0;
            ks.forEach((k, i) => { num += (k - mk) * (xs[i] - mx); den += (k - mk) ** 2; });
            const fitted = num / den;
            return { start: mx + (ks[0] - mk) * fitted, end: mx + (ks[n - 1] - mk) * fitted, count: n - 1 };
        }

        // A grid-line pixel is gray or black (dark enough, little color)
        function isLinePixel(data, i) {
            const r = data[i], g = data[i + 1], b = data[i + 2];
            const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
            return mx < 225 && (mx - mn) < 45;
        }

        // Find evenly spaced grid lines along one axis.
        // Grid lines cross the whole grid, so their rows/columns have many line pixels.
        // Returns { start, end, count } or null.
        function detectGridAxis(px, axis) {
            const { w, h, data } = px;
            const len = axis === 'y' ? h : w;
            const profile = new Float32Array(len);
            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    if (isLinePixel(data, (y * w + x) * 4)) profile[axis === 'y' ? y : x]++;
                }
            }

            const max = Math.max(...profile);
            if (max < (axis === 'y' ? w : h) * 0.2) return null;
            const threshold = max * 0.5;

            // Centers of runs above the threshold = line candidates
            const lines = [];
            let runStart = -1;
            for (let i = 0; i <= len; i++) {
                const on = i < len && profile[i] >= threshold;
                if (on && runStart < 0) runStart = i;
                if (!on && runStart >= 0) { lines.push((runStart + i - 1) / 2); runStart = -1; }
            }
            if (lines.length < 3) return null;

            // Typical spacing (median ignores merged lines and stray marks)
            const gaps = [];
            for (let i = 1; i < lines.length; i++) gaps.push(lines[i] - lines[i - 1]);
            gaps.sort((a, b) => a - b);
            const pitch = gaps[Math.floor(gaps.length / 2)];
            if (pitch < 4) return null;

            const start = lines[0], end = lines[lines.length - 1];
            const count = Math.round((end - start) / pitch);
            if (count < 2 || count > MAX_DETECTED_SIZE) return null;

            // Most expected line positions should have a real line nearby
            const step = (end - start) / count;
            let hits = 0;
            for (let k = 0; k <= count; k++) {
                const pos = start + k * step;
                if (lines.some(l => Math.abs(l - pos) <= step * 0.2)) hits++;
            }
            if (hits / (count + 1) < 0.6) return null;

            return { start, end, count };
        }

        // For pixel art without grid lines: color changes only happen on cell borders,
        // so find a cell count whose borders explain (almost) all change positions.
        // Prefers the current size, otherwise the smallest count that fits. Returns null if none fits.
        function detectBlockCount(px, axis, preferred) {
            const { w, h, data } = px;
            const len = axis === 'x' ? w : h;
            const other = axis === 'x' ? h : w;
            const stride = Math.max(1, Math.floor(other / 200));
            const changed = new Uint8Array(len);
            for (let o = 0; o < other; o += stride) {
                for (let i = 1; i < len; i++) {
                    const a = (axis === 'x' ? o * w + i - 1 : (i - 1) * w + o) * 4;
                    const b = (axis === 'x' ? o * w + i : i * w + o) * 4;
                    const diff = Math.abs(data[a] - data[b]) + Math.abs(data[a + 1] - data[b + 1]) + Math.abs(data[a + 2] - data[b + 2]);
                    if (diff > 60) changed[i] = 1;
                }
            }
            const positions = [];
            for (let i = 1; i < len; i++) if (changed[i]) positions.push(i);
            if (positions.length === 0) return null;

            const fits = (n) => {
                const pitch = len / n;
                const tol = Math.max(1.5, pitch * 0.08);
                const ok = positions.filter(x => Math.abs(x - Math.round(x / pitch) * pitch) <= tol).length;
                return ok / positions.length >= 0.95;
            };
            if (preferred && fits(preferred)) return preferred;
            for (let n = 2; n <= MAX_DETECTED_SIZE; n++) {
                if (fits(n)) return n;
            }
            return null;
        }

        // Colour of each cell: the middle value (median) of its inner area, away from the grid lines.
        // The median ignores small marks inside cells (numbers, circles, stars, dots).
        function sampleCells(px, box) {
            const { w, h, data } = px;
            const cw = (box.x1 - box.x0) / box.w;
            const ch = (box.y1 - box.y0) / box.h;
            const steps = 10;
            const median = (arr) => { arr.sort((a, b) => a - b); return arr[arr.length >> 1]; };
            const cells = [];
            for (let r = 0; r < box.h; r++) {
                const row = [];
                for (let c = 0; c < box.w; c++) {
                    const rs = [], gs = [], bs = [];
                    for (let sy = 0; sy < steps; sy++) {
                        for (let sx = 0; sx < steps; sx++) {
                            const x = Math.floor(box.x0 + (c + 0.2 + 0.6 * (sx + 0.5) / steps) * cw);
                            const y = Math.floor(box.y0 + (r + 0.2 + 0.6 * (sy + 0.5) / steps) * ch);
                            if (x < 0 || y < 0 || x >= w || y >= h) continue;
                            const i = (y * w + x) * 4;
                            rs.push(data[i]); gs.push(data[i + 1]); bs.push(data[i + 2]);
                        }
                    }
                    row.push(rs.length ? [median(rs), median(gs), median(bs)] : [255, 255, 255]);
                }
                cells.push(row);
            }
            return cells;
        }

        // Group similar cell colors into the design's own colors.
        // White / near-white cells become empty (not painted).
        function groupColors(cellColors) {
            const isWhite = ([r, g, b]) => Math.min(r, g, b) > 215;
            const clusters = []; // { sum: [r,g,b], n }
            const assign = cellColors.map(row => row.map(rgb => {
                if (isWhite(rgb)) return -1;
                let best = -1, bestDist = 45;
                clusters.forEach((cl, i) => {
                    const d = colorDistance(...rgb, cl.sum[0] / cl.n, cl.sum[1] / cl.n, cl.sum[2] / cl.n);
                    if (d < bestDist) { bestDist = d; best = i; }
                });
                if (best < 0) {
                    clusters.push({ sum: [0, 0, 0], n: 0 });
                    best = clusters.length - 1;
                }
                const cl = clusters[best];
                cl.sum[0] += rgb[0]; cl.sum[1] += rgb[1]; cl.sum[2] += rgb[2]; cl.n++;
                return best;
            }));

            let clusterHex;
            if (clusters.length > MAX_DESIGN_COLORS) {
                // Too many colors (e.g. a photo): fall back to the basic 10 colors
                clusterHex = clusters.map(cl => {
                    const [r, g, b] = cl.sum.map(v => v / cl.n);
                    return PALETTE[closestPaletteIndex(r, g, b)].hex;
                });
            } else {
                clusterHex = clusters.map(cl => {
                    const [r, g, b] = cl.sum.map(v => v / cl.n);
                    // Snap to a basic color if it is practically the same
                    const p = PALETTE[closestPaletteIndex(r, g, b)];
                    return colorDistance(r, g, b, ...hexToRgb(p.hex)) < 20 ? p.hex : rgbToHex(r, g, b);
                });
            }

            const grid = assign.map(row => row.map(i => i < 0 ? null : clusterHex[i]));
            const colors = [...new Set(clusterHex)];
            return { grid, colors };
        }

        // --- GIF decoder (all scenes, composited like a browser plays them) ---
        function decodeGIF(bytes) {
            let p = 6; // skip "GIF89a"
            const u8 = () => bytes[p++];
            const u16 = () => { const v = bytes[p] | (bytes[p + 1] << 8); p += 2; return v; };
            const readColorTable = (n) => { const t = bytes.subarray(p, p + n * 3); p += n * 3; return t; };
            const skipSubBlocks = () => { let n; while ((n = u8())) p += n; };
            const readSubBlocks = () => {
                const parts = [];
                let total = 0, n;
                while ((n = u8())) { parts.push(bytes.subarray(p, p + n)); p += n; total += n; }
                const out = new Uint8Array(total);
                let o = 0;
                parts.forEach(part => { out.set(part, o); o += part.length; });
                return out;
            };

            const W = u16(), H = u16();
            const packed = u8();
            p += 2; // background index, aspect ratio
            const globalTable = (packed & 0x80) ? readColorTable(2 << (packed & 7)) : null;

            const canvas = new Uint8ClampedArray(W * H * 4).fill(255); // white paper
            const frames = [];
            let disposal = 0, transIndex = -1;

            while (p < bytes.length) {
                const block = u8();
                if (block === 0x3B) break; // trailer
                if (block === 0x21) {      // extension
                    const label = u8();
                    if (label === 0xF9) {
                        u8(); // block size (4)
                        const pk = u8();
                        u16(); // delay
                        const ti = u8();
                        u8(); // terminator
                        disposal = (pk >> 2) & 7;
                        transIndex = (pk & 1) ? ti : -1;
                    } else {
                        skipSubBlocks();
                    }
                } else if (block === 0x2C) { // image
                    const fx = u16(), fy = u16(), fw = u16(), fh = u16();
                    const ipk = u8();
                    const table = (ipk & 0x80) ? readColorTable(2 << (ipk & 7)) : globalTable;
                    const interlaced = !!(ipk & 0x40);
                    const minCodeSize = u8();
                    const indices = lzwDecode(readSubBlocks(), minCodeSize, fw * fh);
                    if (!table) throw new Error('no color table');

                    const saved = disposal === 3 ? canvas.slice() : null;
                    const rowOrder = interlaced ? interlaceOrder(fh) : null;
                    for (let i = 0; i < fh; i++) {
                        const y = fy + (rowOrder ? rowOrder[i] : i);
                        if (y >= H) continue;
                        for (let x = 0; x < fw; x++) {
                            const X = fx + x;
                            if (X >= W) continue;
                            const idx = indices[i * fw + x];
                            if (idx === transIndex) continue;
                            const o = (y * W + X) * 4;
                            canvas[o] = table[idx * 3];
                            canvas[o + 1] = table[idx * 3 + 1];
                            canvas[o + 2] = table[idx * 3 + 2];
                            canvas[o + 3] = 255;
                        }
                    }
                    frames.push(canvas.slice());

                    if (disposal === 2) {
                        for (let y = fy; y < Math.min(H, fy + fh); y++) {
                            canvas.fill(255, (y * W + fx) * 4, (y * W + Math.min(W, fx + fw)) * 4);
                        }
                    } else if (saved) {
                        canvas.set(saved);
                    }
                    disposal = 0;
                    transIndex = -1;
                } else {
                    break;
                }
            }
            return { width: W, height: H, frames };
        }

        // Interlaced GIF rows arrive as rows 0,8,16.. then 4,12.. then 2,6.. then 1,3..
        function interlaceOrder(h) {
            const order = [];
            [[0, 8], [4, 8], [2, 4], [1, 2]].forEach(([start, step]) => {
                for (let y = start; y < h; y += step) order.push(y);
            });
            return order;
        }

        function lzwDecode(data, minCodeSize, pixelCount) {
            const clearCode = 1 << minCodeSize;
            const eoiCode = clearCode + 1;
            const out = new Uint8Array(pixelCount);
            const prefix = new Int32Array(4096);
            const suffix = new Uint8Array(4096);
            const stack = new Uint8Array(4097);
            for (let i = 0; i < clearCode; i++) { prefix[i] = -1; suffix[i] = i; }

            let codeSize = minCodeSize + 1;
            let dictSize = eoiCode + 1;
            let buf = 0, bits = 0, dp = 0, op = 0;
            let old = -1, first = 0;

            while (op < pixelCount) {
                while (bits < codeSize) {
                    if (dp >= data.length) return out;
                    buf |= data[dp++] << bits;
                    bits += 8;
                }
                let code = buf & ((1 << codeSize) - 1);
                buf >>>= codeSize;
                bits -= codeSize;

                if (code === clearCode) {
                    codeSize = minCodeSize + 1;
                    dictSize = eoiCode + 1;
                    old = -1;
                    continue;
                }
                if (code === eoiCode) break;
                if (old === -1) {
                    if (code >= clearCode) continue; // malformed
                    out[op++] = suffix[code];
                    old = code;
                    first = code;
                    continue;
                }

                const inCode = code;
                let sp = 0;
                if (code >= dictSize) { // code not in table yet (KwKwK case)
                    stack[sp++] = first;
                    code = old;
                }
                while (code >= clearCode) {
                    stack[sp++] = suffix[code];
                    code = prefix[code];
                }
                first = suffix[code];
                stack[sp++] = first;
                while (sp > 0 && op < pixelCount) out[op++] = stack[--sp];

                if (dictSize < 4096) {
                    prefix[dictSize] = old;
                    suffix[dictSize] = first;
                    dictSize++;
                    if (dictSize === (1 << codeSize) && codeSize < 12) codeSize++;
                }
                old = inCode;
            }
            return out;
        }

        // --- Save (갤러리 / 다운로드) ---
        function drawGridToCanvas(ctx, grid, cellPx) {
