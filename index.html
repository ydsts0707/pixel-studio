            grid.forEach((row, r) => row.forEach((color, c) => {
                ctx.fillStyle = color || EMPTY_HEX;
                ctx.fillRect(c * cellPx, r * cellPx, cellPx, cellPx);
            }));
        }

        // Synchronous so the share sheet still counts as a direct tap (needed on iPad)
        function dataUrlToBlob(dataUrl) {
            const [head, base64] = dataUrl.split(',');
            const type = head.match(/:(.*?);/)[1];
            const bin = atob(base64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new Blob([bytes], { type });
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // Android (Galaxy): download — the gallery shows it in the "Download" album.
        //   (Android's share sheet has no "save to gallery" option.)
        // iPhone/iPad: open the share sheet ("이미지 저장" puts it in Photos).
        //   If sharing is not possible, show the picture so it can be saved by long-press.
        // Computer: download the file.
        async function saveImage(blob, filename, doneMessage) {
            if (/Android/i.test(navigator.userAgent)) {
                downloadBlob(blob, filename);
                showToast(`${doneMessage} 갤러리 → 'Download' 앨범에서 볼 수 있어요.`);
                return;
            }
            const isTouchDevice = navigator.maxTouchPoints > 0;
            if (!isTouchDevice) {
                downloadBlob(blob, filename);
                showToast(`${doneMessage} (다운로드 폴더)`);
                return;
            }
            const file = new File([blob], filename, { type: blob.type });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                showToast("'이미지 저장' 또는 '갤러리'를 누르면 갤러리에 저장돼요!");
                try {
                    await navigator.share({ files: [file] });
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return; // closed the share sheet
                }
            }
            openSavePopup(blob, filename);
        }

        function openSavePopup(blob, filename) {
            if (savePopupUrl) URL.revokeObjectURL(savePopupUrl);
            savePopupUrl = URL.createObjectURL(blob);
            document.getElementById('save-popup-img').src = savePopupUrl;
            document.getElementById('save-popup-download').onclick = () => downloadBlob(blob, filename);
            openModal('save-popup');
        }

        function closeSavePopup() {
            closeModal('save-popup');
        }

        function savePNG() {
            const scale = Math.max(1, Math.floor(1024 / Math.max(gridW, gridH))); // integer scale keeps edges sharp
            const canvas = document.createElement('canvas');
            canvas.width = gridW * scale;
            canvas.height = gridH * scale;
            drawGridToCanvas(canvas.getContext('2d'), frames[currentFrameIndex], scale);
            const blob = dataUrlToBlob(canvas.toDataURL('image/png'));
            saveImage(blob, `pixel_scene_${currentFrameIndex + 1}.png`, `${currentFrameIndex + 1}번 장면 사진 저장 완료!`);
        }

        function saveGIF() {
            const scale = Math.max(1, Math.floor(512 / Math.max(gridW, gridH)));
            const delayCs = Math.round(frameDelay / 10);
            const bytes = encodeGIF(frames, gridW, gridH, scale, delayCs);
            const blob = new Blob([bytes], { type: 'image/gif' });
            saveImage(blob, 'pixel_animation.gif', frames.length > 1
                ? `${frames.length}장면 움직이는 사진 저장 완료!`
                : '저장 완료! 장면을 더 만들면 움직이는 사진이 돼요.');
        }

        // Minimal GIF89a encoder. The color table is built from the colors actually used,
        // so every color stays exact.
        function encodeGIF(frameList, w, h, scale, delayCs) {
            const used = new Set([EMPTY_HEX]);
            frameList.forEach(g => g.forEach(row => row.forEach(v => { if (v) used.add(v.toLowerCase()); })));
            const colors = [...used].slice(0, 256);
            const colorIndex = new Map(colors.map((hex, i) => [hex, i]));
            let bits = 1;
            while ((1 << bits) < colors.length) bits++;
            bits = Math.max(bits, 2);
            const tableSize = 1 << bits;

            const W = w * scale, H = h * scale;
            const out = [];
            const push16 = v => out.push(v & 255, (v >> 8) & 255);
            const pushStr = s => { for (const ch of s) out.push(ch.charCodeAt(0)); };

            // Header + logical screen + global color table
            pushStr('GIF89a');
            push16(W); push16(H);
            out.push(0x80 | 0x70 | (bits - 1), 0, 0);
            for (let i = 0; i < tableSize; i++) {
                out.push(...hexToRgb(colors[i] || '#000000'));
            }
            // Loop forever
            out.push(0x21, 0xFF, 0x0B);
            pushStr('NETSCAPE2.0');
            out.push(0x03, 0x01, 0x00, 0x00, 0x00);

            frameList.forEach(grid => {
                // Graphic control extension (delay)
                out.push(0x21, 0xF9, 0x04, 0x04);
                push16(delayCs);
                out.push(0x00, 0x00);
                // Image descriptor
                out.push(0x2C);
                push16(0); push16(0); push16(W); push16(H);
                out.push(0x00);

                const pixels = new Uint8Array(W * H);
                for (let y = 0; y < H; y++) {
                    const row = grid[Math.floor(y / scale)];
                    for (let x = 0; x < W; x++) {
                        const v = row[Math.floor(x / scale)];
                        pixels[y * W + x] = v ? (colorIndex.get(v.toLowerCase()) || 0) : 0;
                    }
                }
                out.push(bits);
                const lzw = lzwEncode(pixels, bits);
                for (let i = 0; i < lzw.length; i += 255) {
                    const n = Math.min(255, lzw.length - i);
                    out.push(n);
                    for (let j = 0; j < n; j++) out.push(lzw[i + j]);
                }
                out.push(0x00);
            });

            out.push(0x3B);
            return new Uint8Array(out);
        }

        function lzwEncode(indices, minCodeSize) {
            const clearCode = 1 << minCodeSize;
            const eoiCode = clearCode + 1;
            let codeSize = minCodeSize + 1;
            let nextCode = eoiCode + 1;
            let table = new Map();
            const out = [];
            let buf = 0, bufBits = 0;
            const emit = (code) => {
                buf |= code << bufBits;
                bufBits += codeSize;
                while (bufBits >= 8) {
                    out.push(buf & 255);
                    buf >>>= 8;
                    bufBits -= 8;
                }
            };

            emit(clearCode);
            let prefix = indices[0];
            for (let i = 1; i < indices.length; i++) {
                const k = indices[i];
                const key = prefix * 256 + k;
                const found = table.get(key);
                if (found !== undefined) {
                    prefix = found;
                    continue;
                }
                emit(prefix);
                if (nextCode === 4096) {
                    emit(clearCode);
                    table = new Map();
                    codeSize = minCodeSize + 1;
                    nextCode = eoiCode + 1;
                } else {
                    if (nextCode >= (1 << codeSize)) codeSize++;
                    table.set(key, nextCode++);
                }
                prefix = k;
            }
            emit(prefix);
            emit(eoiCode);
            if (bufBits > 0) out.push(buf & 255);
            return out;
        }

        // --- Toast Notification ---
        function showToast(message) {
            const existingToast = document.getElementById('toast-popup');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-popup';
            toast.className = 'fixed top-3 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs sm:text-sm font-bold py-2.5 px-5 rounded-2xl shadow-xl z-[60] transition-opacity duration-300 text-center max-w-[90vw]';
            toast.innerText = message;
            document.body.appendChild(toast);

            setTimeout(() => { toast.style.opacity = '0'; }, 2700);
            setTimeout(() => { toast.remove(); }, 3000);
        }
    </script>
</body>
</html>
